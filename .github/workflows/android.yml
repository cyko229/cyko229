# Builds the Android APK on GitHub's runners, so you never need Android Studio:
# download the finished APK from the run's "Artifacts" section, or from the
# Releases page when you push a tag.
name: APK Android

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch: # lets you start a build by hand from the Actions tab

permissions:
  contents: write # needed to attach the APK to a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Compiler l'APK de debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: remotewake-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      # Keeps a "latest" release up to date on every push to master, so the APK
      # always has a stable address you can open straight from the phone:
      #   https://github.com/cyko229/cyko229/releases/latest
      # An artifact, by contrast, needs a desktop login and expires after 90 days.
      - name: Mettre à jour la release « latest »
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RemoteWake — dernier build
          body: |
            APK compilé automatiquement depuis `master`
            (commit ${{ github.sha }}).

            **Installation :** ouvrez cette page *depuis le téléphone*,
            téléchargez le `.apk` et installez-le. Android demandera
            d'autoriser les « sources inconnues » pour le navigateur.

            Il s'agit d'un build *debug*, signé avec la clé de debug
            d'Android : parfait pour un usage personnel, mais non
            publiable sur le Play Store en l'état.
          files: android/app/build/outputs/apk/debug/*.apk

      # Pushing a tag like v1.0 also makes a numbered, permanent release.
      - name: Publier la release de version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
