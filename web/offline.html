<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RemoteWake — hors ligne</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>RemoteWake</h1>
      <div class="card">
        <h2>Vous êtes hors ligne</h2>
        <p class="muted">
          Impossible de joindre le serveur. Les commandes à distance ont besoin d'une connexion :
          reconnectez-vous puis réessayez.
        </p>
        <button class="primary" onclick="location.reload()">Réessayer</button>
      </div>
    </main>
  </body>
</html>
